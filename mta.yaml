_schema-version: 3.3.0
ID: Backend
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Backend-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Backend-auth
      - name: Backend-db

  - name: Backend-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Backend-db

  # Managed Router (Work Zone) - no standalone approuter module

  - name: Backend-app-content
    type: com.sap.application.content
    path: app/project2
    requires:
      - name: Backend-html5-host
        parameters:
          content-target: true
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
    build-parameters:
      build-result: dist
      requires:
        - name: Backend-project2
          artifacts:
            - ./*
          target-path: resources/
        
  - name: Backend-project2
    type: html5
    path: app/project2

resources:
  - name: Backend-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: Backend-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  # Destination service not required for Managed Router basic setup
  - name: Backend-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  # No html5 runtime or UI5 destination needed with Managed Router
